<div><h2 id="a0000000105">8.6 savu (<a target="source" href="../all.html#line0725">0725</a>)</h2>
<p>This procedure is called by “newproc” (<a target="source" href="../all.html#line1889">1889</a>, <a target="source" href="../all.html#line1905">1905</a>), “swtch” (<a target="source" href="../all.html#line2189">2189</a>, <a target="source" href="../all.html#line2281">2281</a>), “expand” (<a target="source" href="../all.html#line2284">2284</a>), “trapl” (<a target="source" href="../all.html#line2846">2846</a>) and “xswap” (<a target="source" href="../all.html#line4476">4476</a>,<a target="source" href="../all.html#line4477">4477</a>). </p><p>The values of r5 and r6 are stored in the array whose address is passed as a parameter. </p></div>
